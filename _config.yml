title: "Geo-OBS"
author: "Joshua Rehlinghaus"
copyright: "2026 (CC-BY-NC except where otherwise stated)"
logo: content/assets/trilobit_icon.png

repository:
  url: https://github.com/JoshiReh/Geo-OBS
  branch: main

html:
  use_issues_button: true
  use_repository_button: true
  use_edit_page_button: true
  home_page_in_navbar: true
  announcement: 'Geo-OBS is open access and still under construction. Feedback is welcome!'

execute:
  execute_notebooks: "auto"

parse:
  myst_heading_anchors: 4
  myst_enable_extensions:
    - "amsmath"
    - "dollarmath"

only_build_toc_files: true
bibtex_bibfiles: "bibliography.bib"

sphinx:
  config:
    bibtex_reference_style: author_year
    bibtex_default_style: plain
